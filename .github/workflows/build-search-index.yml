# Build the Tower of Babel deep-search (full-text) index and upload it to R2.
#
# WHY THIS EXISTS: the index must be built from the full ~393k-text corpus,
# which cannot be downloaded through the VM's egress proxy in reasonable
# time (measured 21-34 days). A GitHub Actions runner has direct internet,
# so the same proven chunked fetch -> index -> delete loop runs here in
# hours instead of weeks, and the finished shards go to R2 (no git size
# limits, no 100 MiB per-file cap) instead of back into a repo.
#
# TRIGGER: manual dispatch ONLY (workflow_dispatch). No push, schedule, or
# pull-request trigger: a rebuild is a deliberate act, and every run
# re-indexes the whole corpus at the texts-repo HEAD it records in its log.
#
# REQUIRED REPO SECRETS (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  - Cloudflare API token with R2 edit scope.
#   CLOUDFLARE_ACCOUNT_ID - Cloudflare account ID.
# The R2 bucket (tower-search-index) must already exist and be publicly
# readable (managed r2.dev domain or a custom domain on the site zone);
# the site's /search-index functions read from that public URL.
#
# LAYOUT: the indexer scripts live in scripts/deep-search/ in this repo.
# stream-index.mjs / merge-shard.mjs import ./build-tree/src/lib/search-text.js
# (SHARD_COUNT = 256) relative to their own directory, so the bundle must
# stay together exactly as committed. Per-chunk catalog isolation is
# load-bearing: stream-index writes DONE for every catalog entry it is
# given, so each chunk is indexed ONLY from a catalog dir holding that
# chunk's entries (see run-actions-build.sh header).

name: Build deep-search index (R2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: tower-search-index
    steps:
      - name: Check out site repo (catalog shards + indexer bundle only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            public/catalog-shards
            scripts/deep-search
            .github/workflows
          sparse-checkout-cone-mode: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check indexer scripts
        run: |
          for f in scripts/deep-search/*.mjs; do node --check "$f"; done
          bash -n scripts/deep-search/run-actions-build.sh
          echo "all indexer scripts parse"

      - name: Build index and upload to R2
        run: bash scripts/deep-search/run-actions-build.sh

      - name: Upload build log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-index-build-log
          path: .search-build/build.log
          if-no-files-found: warn
