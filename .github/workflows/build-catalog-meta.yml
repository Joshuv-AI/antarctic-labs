# Build the Tower of Babel Phase B catalog metadata products (metadata
# postings, facet postings + counts, record blocks) and upload them to R2
# under meta/<fingerprint>/, manifest last (the manifest is the commit
# point; meta/latest.json is written only after it).
#
# WHY: Phase B moves catalog search + browse server-side so the client
# never downloads the catalog index. The products are derived from the
# compact catalog-index shards at publish time and versioned by the
# catalog fingerprint (sha256 of the shard bytes, computed by the
# generator), so a new catalog publish = a new prefix; the endpoint
# switches by reading meta/latest.json.
#
# TRIGGER: manual dispatch ONLY. A rebuild is a deliberate act (same rule
# as build-search-index.yml); wire a publish hook only after the endpoint
# cutover is proven.
#
# REQUIRED REPO SECRETS: CLOUDFLARE_API_TOKEN (R2 edit scope),
# CLOUDFLARE_ACCOUNT_ID — the same secrets build-search-index.yml uses.
# Bucket: tower-search-index (already public via search-index domain).

name: Build catalog metadata products (Phase B, R2)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: tower-search-index
    steps:
      - name: Check out site repo (catalog index + generator + shared libs only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            public/catalog-index-shards
            scripts/build-catalog-meta.mjs
            src/lib/search-text.js
            src/lib/tower-taxonomy.js
          sparse-checkout-cone-mode: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check the generator
        run: node --check scripts/build-catalog-meta.mjs

      - name: Generate the metadata products
        run: node scripts/build-catalog-meta.mjs public/catalog-index-shards meta-out

      # Wrangler is installed ONCE, globally, before the upload loop.
      # Run #1 (2026-10-28) failed here: 8 parallel `npx --yes wrangler@3`
      # invocations raced on the shared npx cache (TAR_ENTRY_ERROR ENOENT,
      # then MODULE_NOT_FOUND for wrangler-dist/cli.js, exit 123) and the
      # generated products died with the runner. Parallel wrangler calls
      # against an installed package are safe; parallel npx installs are not.
      - name: Install wrangler (once, globally)
        run: |
          npm install -g wrangler@3
          wrangler --version

      - name: Upload products to R2 (manifest last)
        run: |
          FP=$(node -p "JSON.parse(require('fs').readFileSync('meta-out/manifest.json','utf8')).fingerprint")
          echo "fingerprint: $FP"
          export FP
          find meta-out -type f ! -name manifest.json -print0 | xargs -0 -P 8 -I{} sh -c 'rel="${1#meta-out/}"; wrangler r2 object put "$R2_BUCKET/meta/$FP/$rel" --file "$1" --content-type application/json >/dev/null' _ {}
          wrangler r2 object put "$R2_BUCKET/meta/$FP/manifest.json" --file meta-out/manifest.json --content-type application/json
          printf '{"fingerprint":"%s"}' "$FP" > meta-out/latest.json
          wrangler r2 object put "$R2_BUCKET/meta/latest.json" --file meta-out/latest.json --content-type application/json
          echo "uploaded under meta/$FP/ and updated meta/latest.json"
