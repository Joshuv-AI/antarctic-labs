name: regen-api-search-shards
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            public/catalog-index-shards
            public/api-search-shards
            scripts/build-api-search-shards.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild API search shards from the current catalog index
        run: node scripts/build-api-search-shards.mjs
      - name: Commit and push
        run: |
          git config user.name "tower-api-search-regen"
          git config user.email "actions@antarctic-labs.com"
          git add public/api-search-shards
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          TOTAL=$(node -p "JSON.parse(require('fs').readFileSync('public/api-search-shards/manifest.json','utf8')).total")
          SHARDS=$(node -p "JSON.parse(require('fs').readFileSync('public/api-search-shards/manifest.json','utf8')).shards")
          git commit -m "[CF-Pages-Skip] API search shards regenerated from the current catalog index (${TOTAL} entries in ${SHARDS} byte-budget shards; count published in api-search-shards/manifest.json)"
          git push origin HEAD:main
