<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Antarctic Labs</title>
  <desc id="desc">Antarctic Labs polar mountain mark</desc>

  <rect
    width="64"
    height="64"
    rx="14"
    fill="#071018"
  />

  <!-- Rear mountain -->
  <path
    d="M8 47.5 25.2 22.5 32.3 33.2 40.7 20.7 56 47.5Z"
    fill="#edf6fa"
  />

  <!-- Main snow plane -->
  <path
    d="M8 47.5 25.2 22.5 32.3 33.2 25.4 47.5Z"
    fill="#ffffff"
  />

  <!-- Cold shadow plane -->
  <path
    d="M25.4 47.5 32.3 33.2 40.7 20.7 37.4 47.5Z"
    fill="#a9d3e4"
  />

  <!-- Secondary ridge -->
  <path
    d="M37.4 47.5 40.7 20.7 56 47.5Z"
    fill="#d9edf3"
  />

  <!-- Deep polar shadow -->
  <path
    d="M37.4 47.5 40.7 20.7 44.3 47.5Z"
    fill="#87b7ce"
    opacity=".72"
  />

  <!-- Horizon -->
  <path
    d="M8 49.5H56"
    fill="none"
    stroke="#73d7d0"
    stroke-width="1.5"
    stroke-linecap="round"
  />

  <!-- Small aurora signal -->
  <path
    d="M18 16.5C23.5 13.4 28.2 14.2 32.2 17.2C36.1 20.2 40.7 20.7 46 17.8"
    fill="none"
    stroke="#73d7d0"
    stroke-width="1"
    stroke-linecap="round"
    opacity=".62"
  />
</svg>