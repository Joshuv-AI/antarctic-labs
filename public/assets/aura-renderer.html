<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Antarctic Labs — Aurora Borealis</title>
  <style>
    /* ------------------------------------------------------------- */
    /* Aurora Borealis — STEP 24 production port.                   */
    /* Screen-space 2D layers (CSS + SVG + 2D canvas).             */
    /* No WebGL, no GLB, no 3D math. Self-contained fallback below. */
    /* ------------------------------------------------------------- */
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02060c;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    canvas { display: block; width: 100%; height: 100%; position: absolute; inset: 0; }
    /* Layer order (z-index): sky=1, aurora=2, ridge=4, water=3, foreground=5.
     * Note water sits UNDER the ridge (water at bottom, ridge above water visually)
     * but the ridge's z-index 4 + renderOrder after water's 3 means ridge paints
     * on top — matches the reference's snow peaks above water surface. */
    #sky-layer {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 35% at 50% 88%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 60%, rgba(0,0,0,0.95) 100%),
        linear-gradient(
          to bottom,
          #05091a 0%,
          #0a1f48 18%,
          #156598 38%,
          #3089b6 56%,
          #6fd4d8 72%,
          #2b6580 82%,
          #050d1e 100%
        );
    }
    #ridge-layer, #water-layer, #foreground-layer {
      position: absolute; left: 0; width: 100%; pointer-events: none;
    }
    #water-layer {
      bottom: 0; height: 30%; z-index: 3;
      background:
        linear-gradient(
          to bottom,
          rgba(76, 255, 168, 0.18) 0%,
          rgba(78, 192, 200, 0.22) 18%,
          rgba(20, 50, 80, 0.95) 50%,
          rgba(4, 12, 22, 1) 100%
        );
    }
    /* Subtle horizontal ripple bands over the water. */
    #water-layer::before {
      content: "";
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.0) 0px,
        rgba(255,255,255,0.0) 4px,
        rgba(255,255,255,0.04) 5px,
        rgba(255,255,255,0.0) 6px
      );
      mix-blend-mode: screen;
      opacity: 0.5;
    }
    #ridge-layer {
      bottom: 28%; height: 8%; z-index: 4;
    }
    #ridge-layer svg {
      width: 100%; height: 100%; display: block;
    }
    #foreground-layer {
      bottom: 0; height: 7%; z-index: 5;
      background: linear-gradient(
        to bottom,
        rgba(1,3,6,0.0) 0%,
        rgba(1,3,6,0.92) 40%,
        rgba(1,3,6,1.0) 100%
      );
    }
    #aurora-canvas {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
    }
    /* Aurora entrance / smooth fade-in. */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    body { animation: fadeIn 1.2s ease-out both; }
    /* Honor reduced-motion preference. */
    @media (prefers-reduced-motion: reduce) {
      #aurora-canvas { display: none; }
      body { animation: none; }
    }
  </style>
</head>
<body>
  <div id="sky-layer"></div>
  <canvas id="aurora-canvas"></canvas>
  <div id="ridge-layer">
    <svg viewBox="0 0 1920 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"
         aria-hidden="true">
      <defs>
        <linearGradient id="ridge-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#b8c4d8" stop-opacity="0.85"/>
          <stop offset="35%" stop-color="#3a506e" stop-opacity="1"/>
          <stop offset="100%" stop-color="#08121e" stop-opacity="1"/>
        </linearGradient>
        <linearGradient id="ridge-snow" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#f4faff" stop-opacity="1"/>
          <stop offset="50%" stop-color="#b8c4d8" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#b8c4d8" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path id="ridge-back"  d="" fill="url(#ridge-grad)"/>
      <path id="ridge-front" d="" fill="url(#ridge-grad)"/>
      <path id="ridge-snow-overlay" d="" fill="url(#ridge-snow)"/>
    </svg>
  </div>
  <div id="water-layer"></div>
  <div id="foreground-layer"></div>

  <script>
  /* ---------------------------------------------------------------- */
  /* Production Aurora renderer (STEP 24).                             */
  /* Self-contained: no WebGL, no GLB, no external dependencies.        */
  /* Screen-space 2D layers. Falls back to a static gradient if the   */
  /* 2D canvas fails (ancient browser).                               */
  /* ---------------------------------------------------------------- */
  (function () {
    'use strict';

    try {
      var canvas = document.getElementById('aurora-canvas');
      if (!canvas || !canvas.getContext || !canvas.getContext('2d')) {
        throw new Error('2d canvas unavailable');
      }
      var ctx = canvas.getContext('2d');

      /* ---------- procedural ridge path generator ---------- */
      function buildRidgePath(width, baselineY, peakHeight, peaks, seed) {
        var s = seed >>> 0;
        function rnd() {
          s = (s + 0x6D2B79F5) >>> 0;
          var t = s;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        }
        var pts = [];
        for (var i = 0; i <= peaks; i++) {
          var x = (i / peaks) * width;
          var rid = Math.sin(i * 0.5 + 1.3) * 0.5 + 0.5;
          var bump = Math.sin(i * 1.7 + 0.7 + rnd() * 0.3) * 0.3;
          var detail = (rnd() - 0.5) * 0.18;
          var h = peakHeight * Math.max(0.15, 0.3 + 0.7 * (rid + bump + detail));
          pts.push([x, baselineY - h]);
        }
        var d = 'M ' + pts[0][0] + ' ' + baselineY + ' L ';
        for (var j = 0; j < pts.length; j++) {
          d += pts[j][0].toFixed(1) + ' ' + pts[j][1].toFixed(1) + ' ';
          if (j < pts.length - 1) d += 'L ';
        }
        d += 'L ' + width + ' ' + baselineY + ' Z';
        return d;
      }
      var VIEW_W = 1920, VIEW_H = 100;
      var back  = buildRidgePath(VIEW_W, VIEW_H, 78, 22, 7);
      var front = buildRidgePath(VIEW_W, VIEW_H, 92, 28, 13);
      var snow  = buildRidgePath(VIEW_W, VIEW_H, 92, 28, 13);
      document.getElementById('ridge-back').setAttribute('d', back);
      document.getElementById('ridge-front').setAttribute('d', front);
      document.getElementById('ridge-snow-overlay').setAttribute('d', snow);

      /* ---------- single aurora curtain (S-arc + glow) ---------- */
      function drawCurtain(ctx, w, h, opts) {
        var t = opts.t;
        var phase = opts.phase;
        var wobble = Math.sin(t * 0.8 + phase) * 12;
        /* Quadratic bezier control points with subtle wobble. */
        var p0 = [opts.x0, opts.y0];
        var pm = [opts.cx + Math.sin(t * 0.6 + phase * 1.3) * 8,
                  opts.cy + wobble];
        var p1 = [opts.x1, opts.y1 + Math.sin(t * 0.5 + phase * 0.7) * 6];
        function strokeCurve(width, color, alpha) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = color;
          ctx.lineWidth = width;
          ctx.lineCap = 'butt';
          ctx.beginPath();
          ctx.moveTo(p0[0], p0[1]);
          ctx.quadraticCurveTo(pm[0], pm[1], p1[0], p1[1]);
          ctx.stroke();
          ctx.restore();
        }
        strokeCurve(opts.glowWidth * 2.4, opts.glowColor, 0.18);
        strokeCurve(opts.glowWidth * 1.4, opts.glowColor, 0.35);
        strokeCurve(opts.glowWidth * 0.7, opts.glowColor, 0.55);
        strokeCurve(opts.coreWidth,    opts.coreColor, 0.85);
        strokeCurve(opts.coreWidth * 0.5, 'rgba(255,255,255,1)', 0.45);
      }

      /* ---------- 5 aurora curtains, viewport-relative ---------- */
      function renderAurora(t) {
        var w = canvas.width;
        var h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        var curtains = [
          // Far back curtain — cyan, far left
          { x0: w * 0.05, y0: h * 0.78, cx: w * 0.13, cy: h * 0.50, x1: w * 0.20, y1: h * 0.20,
            coreColor: 'rgba(180, 240, 255, 1)', glowColor: 'rgba(80, 200, 220, 1)',
            coreWidth: 4, glowWidth: 24, phase: 0 },
          // Mid-left bright green/teal
          { x0: w * 0.22, y0: h * 0.82, cx: w * 0.28, cy: h * 0.48, x1: w * 0.30, y1: h * 0.22,
            coreColor: 'rgba(180, 255, 220, 1)', glowColor: 'rgba(60, 230, 180, 1)',
            coreWidth: 6, glowWidth: 32, phase: 1.2 },
          // Center — tallest, brightest
          { x0: w * 0.40, y0: h * 0.85, cx: w * 0.48, cy: h * 0.42, x1: w * 0.42, y1: h * 0.18,
            coreColor: 'rgba(200, 255, 230, 1)', glowColor: 'rgba(80, 240, 200, 1)',
            coreWidth: 7, glowWidth: 36, phase: 2.4 },
          // Mid-right — secondary green
          { x0: w * 0.55, y0: h * 0.83, cx: w * 0.62, cy: h * 0.45, x1: w * 0.58, y1: h * 0.20,
            coreColor: 'rgba(190, 255, 220, 1)', glowColor: 'rgba(70, 220, 170, 1)',
            coreWidth: 5, glowWidth: 30, phase: 3.6 },
          // Far right — cyan/blue
          { x0: w * 0.78, y0: h * 0.80, cx: w * 0.85, cy: h * 0.50, x1: w * 0.88, y1: h * 0.22,
            coreColor: 'rgba(160, 240, 255, 1)', glowColor: 'rgba(70, 180, 220, 1)',
            coreWidth: 4, glowWidth: 26, phase: 4.8 },
        ];
        for (var i = 0; i < curtains.length; i++) {
          drawCurtain(ctx, w, h, { t: t, phase: curtains[i].phase,
            x0: curtains[i].x0, y0: curtains[i].y0,
            cx: curtains[i].cx, cy: curtains[i].cy,
            x1: curtains[i].x1, y1: curtains[i].y1,
            coreColor: curtains[i].coreColor, glowColor: curtains[i].glowColor,
            coreWidth: curtains[i].coreWidth, glowWidth: curtains[i].glowWidth });
        }
      }

      /* ---------- responsive sizing ---------- */
      function layout() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var dpr = Math.min(window.devicePixelRatio || 1, 1.75);
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var ridgeHeight = Math.round(h * 0.10);
        var ridgeBottom = Math.round(h * 0.22);
        var waterHeight = Math.round(h * 0.30);
        var foregroundHeight = Math.round(h * 0.06);
        var ridgeLayer = document.getElementById('ridge-layer');
        var waterLayer = document.getElementById('water-layer');
        var foregroundLayer = document.getElementById('foreground-layer');
        ridgeLayer.style.height = ridgeHeight + 'px';
        ridgeLayer.style.bottom = ridgeBottom + 'px';
        waterLayer.style.height = waterHeight + 'px';
        foregroundLayer.style.height = foregroundHeight + 'px';
      }
      window.addEventListener('resize', layout);
      layout();

      /* ---------- animation loop with pause support ---------- */
      var paused = false;
      window.addEventListener('message', function (e) {
        if (e && e.data && e.data.type === 'aura-controls') {
          paused = !!(e.data.controls && e.data.controls.paused);
        }
      });
      var startT = 0;
      function loop(t) {
        requestAnimationFrame(loop);
        if (startT === 0) startT = t;
        if (paused) return;
        renderAurora((t - startT) / 1000);
      }
      requestAnimationFrame(loop);

      document.title = 'ready';
    } catch (e) {
      /* Clean fallback: still show the saturated sky + ridge + water + foreground.
       * The aurora layer simply won't appear. Page cannot be blank. */
      console.error('[Aura] rendering init failed; falling back to static layers.', e);
      document.title = 'aurora-fallback';
    }
  })();
  </script>
</body>
</html>
