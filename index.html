    <!-- Tower of Babel boot loader: branded loading animation shown during
         the initial page load on Tower routes only. Pure HTML/CSS so it
         paints before the JS bundle parses; React dismisses it on mount,
         and a hard timeout guarantees it can never trap the user. -->
    <style>
      #tb-boot {
        position: fixed; inset: 0; z-index: 200;
        display: flex; align-items: center; justify-content: center;
        background: #161510; color: #ede7d7;
      }
      #tb-boot[hidden] { display: none; }
      .tb-boot-inner { text-align: center; padding: 0 24px; }
      .tb-boot-kicker {
        font: 400 10px/1 "DM Mono", ui-monospace, monospace;
        letter-spacing: .34em; text-transform: uppercase; color: #71737b;
        margin-bottom: 22px;
        animation: tb-boot-fade 1s ease .15s both;
      }
      .tb-boot-title {
        margin: 0 0 26px;
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
        font-size: clamp(38px, 8vw, 84px);
        letter-spacing: .06em;
        line-height: 1.05;
        display: flex; justify-content: center; flex-wrap: wrap;
      }
      .tb-boot-title .tb-l {
        display: inline-block; overflow: hidden;
      }
      .tb-boot-title .tb-l > span {
        display: inline-block;
        transform: translateY(115%);
        animation: tb-boot-rise .8s cubic-bezier(.2,.7,.2,1) forwards;
      }
      .tb-boot-title .tb-sp { width: .35em; }
      .tb-boot-rule {
        height: 1px; width: min(320px, 60vw); margin: 0 auto 20px;
        background: #0f7d95;
        transform: scaleX(0); transform-origin: left center;
        animation: tb-boot-rule 1.4s cubic-bezier(.2,.7,.2,1) .5s forwards;
      }
      .tb-boot-sub {
        font: 400 10px/1 "DM Mono", ui-monospace, monospace;
        letter-spacing: .28em; text-transform: uppercase; color: #71737b;
        animation: tb-boot-fade 1s ease .9s both;
      }
      @keyframes tb-boot-rise { to { transform: translateY(0); } }
      @keyframes tb-boot-rule { to { transform: scaleX(1); } }
      @keyframes tb-boot-fade { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #tb-boot * { animation-duration: .01s !important; animation-delay: 0s !important; }
      }
    </style>

    <!-- Google AdSense site verification (2026-10-25, pub-9404729840269984).
         Verification script only: no ad units are created here, so no ads
         render from this tag alone. CSP in public/_headers must allow
         pagead2.googlesyndication.com or this script is blocked. -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9404729840269984" crossorigin="anonymous"></script>
  </head>

  <body>
    <div id="tb-boot" hidden>
      <div class="tb-boot-inner">
        <div class="tb-boot-kicker">Antarctic Labs</div>
        <h1 class="tb-boot-title">Tower of Babel</h1>
        <div class="tb-boot-rule"></div>
        <div class="tb-boot-sub">Entering the library</div>
      </div>
    </div>
    <script>
      (function () {
        var boot = document.getElementById("tb-boot");
        if (!boot) return;
        var t0 = Date.now();
        var done = false;
        // Diagnostic (2026-10-01): surface JS errors in the loader so a
        // crash on the user's device is visible instead of a silent hang.
        window.addEventListener("error", function (e) {
          var sub = boot.querySelector(".tb-boot-sub");
          if (sub && !done) {
            sub.textContent = "ERROR: " + (e.message || "script failed").slice(0, 80);
            sub.style.color = "#b00";
          }
        });
        function dismiss() {
          if (done) return; done = true;
          var wait = Math.max(0, 1000 - (Date.now() - t0));
          // Instant removal, NO fade (2026-11-11 presentation fix):
          // the old .55s opacity crossfade composited this overlay's
          // title semi-transparently over the already-painted landing
          // — two titles ghosted at once in Joshua's phone video. The
          // overlay stays fully opaque until the removal instant, so
          // it is never visible simultaneously with page content.
          setTimeout(function () { boot.remove(); }, wait);
        }
        window.__dismissTowerBoot = dismiss;
        if (location.pathname.indexOf("/tower-of-babel") !== 0) {
          boot.remove();
          return;
        }
        boot.hidden = false;
        // Head start (2026-11-10, Joshua's call): while this animation
        // plays, the catalog download starts too — before the JS bundle
        // has even parsed. The bootstrap chunk and the first baked
        // browse pages are immutable and edge-cached, so fetching them
        // now parks them in the browser's HTTP cache; when the app's
        // browse streamer starts a moment later, its first pages are
        // cache hits instead of network waits. Fire-and-forget: a
        // failed prefetch changes nothing (the streamer fetches what
        // it needs itself), and nothing here touches the dismissal
        // logic.
        try {
          fetch("/catalog-bootstrap.json")
            .then(function (r) { return r.arrayBuffer(); })
            .catch(function () {});
          // Entry pages (/tower-of-babel/library/<id>) are excluded:
          // their own text fetch needs the connection first, and the
          // app starts the browse stream there once the entry's
          // record has settled (2026-11-10). The Tower landing IS
          // included (2026-11-11, Joshua's reversal of the
          // landing-lazy exclusion): the landing loads the library
          // from the top of the page, the second it opens.
          var onLibrary =
            location.pathname === "/tower-of-babel" ||
            location.pathname === "/tower-of-babel/library";
          if (onLibrary) {
            fetch("/api/browse-manifest")
              .then(function (r) { return r.json(); })
              .then(function (m) {
                if (!m || !m.fingerprint || !m.browse_pages) return;
                // Hand the parsed manifest to the app (2026-11-12,
                // audit F2): catalog.js's discovery reads
                // window.__browseManifest first, so the app doesn't
                // re-fetch what this script already parsed — one
                // less request on the library's fragile front door.
                window.__browseManifest = m;
                var n = Math.min(4, m.browse_pages);
                for (var i = 0; i < n; i++) {
                  var name = "page-000" + i + ".json";
                  fetch("/browse-pages/" + m.fingerprint + "/" + name)
                    .then(function (r) { return r.arrayBuffer(); })
                    .catch(function () {});
                }
              })
              .catch(function () {});
          }
        } catch (e) { /* prefetch is best-effort only */ }
        // Hard failsafe: never trap the user — but never fade to a blank
        // page either. On a slow connection the bundle can take longer than
        // 4s to load; dismissing blindly would leave the user staring at an
        // empty page that looks "stuck". So at 4s, only dismiss if React has
        // actually mounted (root has content). Otherwise keep the loader and
        // re-check, with a 20s absolute cap.
        // Diagnostic (2026-10-01): if React hasn't mounted after 10s, show
        // a status in the loader so we can tell a slow bundle from a
        // crashed mount on the user's device.
        var checks = 0;
        var diagShown = false;
        var failsafe = setInterval(function () {
          checks++;
          var root = document.getElementById("root");
          var mounted = root && root.children.length > 0;
          if (!mounted && checks === 20 && !diagShown) {
            diagShown = true;
            var sub = boot.querySelector(".tb-boot-sub");
            if (sub) sub.textContent = "LOADING APP… (STILL WAITING)";
          }
          if (mounted || checks >= 40) {
            clearInterval(failsafe);
            dismiss();
          }
        }, 500);
        var title = boot.querySelector(".tb-boot-title");
        var text = title.textContent;
        title.textContent = "";
        var i, ch, wrap, inner;
        for (i = 0; i < text.length; i++) {
          ch = text[i];
          wrap = document.createElement("span");
          if (ch === " ") { wrap.className = "tb-l tb-sp"; wrap.innerHTML = "&nbsp;"; }
          else {
            wrap.className = "tb-l";
            inner = document.createElement("span");
            inner.textContent = ch;
            inner.style.animationDelay = (0.08 + i * 0.045) + "s";
            wrap.appendChild(inner);
          }
          title.appendChild(wrap);
        }
      })();
    </script>

        <p>Antarctic Labs is an independent laboratory for AI and computing — judged by the work it puts into the world. We build AI and computing systems and point them at hard problems — in any field where they appear, and we stay with them until they are solved. Our featured project is the Tower of Babel, below.</p>
        <p>The firm also runs the <a href="/tower-of-babel">Tower of Babel</a>, a free online library of 2,557,923 books, sacred texts, declassified documents, papers, and transcripts, preserved in clean, searchable text. No accounts, no paywalls.</p>
        <p>This site needs JavaScript for its full experience. Without it, you can still read about <a href="/about">the firm</a>, browse the <a href="/tower-of-babel/library">library catalog</a>, get <a href="/tower-of-babel/library/research">API access</a>, <a href="/tower-of-babel/library/suggest">suggest an entry</a>, <a href="/tower-of-babel/donate">support the library</a>, or read our <a href="/privacy">Privacy Policy</a>. Contact: <a href="mailto:hello@antarctic-labs.com">hello@antarctic-labs.com</a>.</p>
      </div>
    </noscript>

    <div id="root"></div>

    ></script>
