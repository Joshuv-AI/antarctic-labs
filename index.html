    <!-- Tower of Babel boot loader: branded loading animation shown during
         the initial page load on Tower routes only. Pure HTML/CSS so it
         paints before the JS bundle parses; React dismisses it on mount,
         and a hard timeout guarantees it can never trap the user. -->
    <style>
      #tb-boot {
        position: fixed; inset: 0; z-index: 200;
        display: flex; align-items: center; justify-content: center;
        background: #f4f1ea; color: #20242b;
        transition: opacity .55s ease;
      }
      #tb-boot[hidden] { display: none; }
      #tb-boot.tb-boot-done { opacity: 0; pointer-events: none; }
      .tb-boot-inner { text-align: center; padding: 0 24px; }
      .tb-boot-kicker {
        font: 400 10px/1 "DM Mono", ui-monospace, monospace;
        letter-spacing: .34em; text-transform: uppercase; color: #71737b;
        margin-bottom: 22px;
        animation: tb-boot-fade 1s ease .15s both;
      }
      .tb-boot-title {
        margin: 0 0 26px;
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
        font-size: clamp(38px, 8vw, 84px);
        letter-spacing: .06em;
        line-height: 1.05;
        display: flex; justify-content: center; flex-wrap: wrap;
      }
      .tb-boot-title .tb-l {
        display: inline-block; overflow: hidden;
      }
      .tb-boot-title .tb-l > span {
        display: inline-block;
        transform: translateY(115%);
        animation: tb-boot-rise .8s cubic-bezier(.2,.7,.2,1) forwards;
      }
      .tb-boot-title .tb-sp { width: .35em; }
      .tb-boot-rule {
        height: 1px; width: min(320px, 60vw); margin: 0 auto 20px;
        background: #0f7d95;
        transform: scaleX(0); transform-origin: left center;
        animation: tb-boot-rule 1.4s cubic-bezier(.2,.7,.2,1) .5s forwards;
      }
      .tb-boot-sub {
        font: 400 10px/1 "DM Mono", ui-monospace, monospace;
        letter-spacing: .28em; text-transform: uppercase; color: #71737b;
        animation: tb-boot-fade 1s ease .9s both;
      }
      @keyframes tb-boot-rise { to { transform: translateY(0); } }
      @keyframes tb-boot-rule { to { transform: scaleX(1); } }
      @keyframes tb-boot-fade { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #tb-boot * { animation-duration: .01s !important; animation-delay: 0s !important; }
      }
    </style>
  </head>

  <body>
    <div id="tb-boot" hidden>
      <div class="tb-boot-inner">
        <div class="tb-boot-kicker">Antarctic Labs</div>
        <h1 class="tb-boot-title">Tower of Babel</h1>
        <div class="tb-boot-rule"></div>
        <div class="tb-boot-sub">Entering the library</div>
      </div>
    </div>
    <script>
      (function () {
        var boot = document.getElementById("tb-boot");
        if (!boot) return;
        var t0 = Date.now();
        var done = false;
        function dismiss() {
          if (done) return; done = true;
          var wait = Math.max(0, 1000 - (Date.now() - t0));
          setTimeout(function () {
            boot.classList.add("tb-boot-done");
            setTimeout(function () { boot.remove(); }, 650);
          }, wait);
        }
        window.__dismissTowerBoot = dismiss;
        if (location.pathname.indexOf("/tower-of-babel") !== 0) {
          boot.remove();
          return;
        }
        boot.hidden = false;
        setTimeout(dismiss, 4000); // hard failsafe: never trap the user
        var title = boot.querySelector(".tb-boot-title");
        var text = title.textContent;
        title.textContent = "";
        var i, ch, wrap, inner;
        for (i = 0; i < text.length; i++) {
          ch = text[i];
          wrap = document.createElement("span");
          if (ch === " ") { wrap.className = "tb-l tb-sp"; wrap.innerHTML = "&nbsp;"; }
          else {
            wrap.className = "tb-l";
            inner = document.createElement("span");
            inner.textContent = ch;
            inner.style.animationDelay = (0.08 + i * 0.045) + "s";
            wrap.appendChild(inner);
          }
          title.appendChild(wrap);
        }
      })();
    </script>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
