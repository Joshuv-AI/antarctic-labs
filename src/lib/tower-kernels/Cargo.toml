[package]
name = "tower-kernels"
version = "1.0.0"
edition = "2021"
description = "Tower of Babel counting/derivation + helix reshape-allocation kernels (Rust/WASM port of the JS in src/pages.jsx, src/lib/filter-engine.js, src/lib/helix-scene.js) with exact-parity semantics"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# unwind (not abort): every export wraps its body in catch_unwind and
# reports a Rust panic to JS as an error code, so a kernel fault
# degrades exactly like a JS-path failure does — the caller falls
# back to the retained JavaScript implementation.
panic = "unwind"
