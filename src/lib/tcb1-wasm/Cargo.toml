[package]
name = "tcb1-decoder"
version = "1.0.0"
edition = "2021"
description = "TCB1 browse-dataset decoder (Tower of Babel) compiled to WebAssembly; byte-parity port of the TCB1 session in src/lib/tcb1.js"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# unwind (not abort): every export wraps its body in catch_unwind and
# reports a Rust panic to JS as an error code, so a decoder fault
# degrades exactly like corrupt input does in the JS path.
panic = "unwind"
